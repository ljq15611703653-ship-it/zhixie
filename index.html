<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="回答 20 个问题，看看智械危机时你是谁。">
<title>智械危机征召令</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: 全屏动态场景（天上一只机械之眼，地上一个举着光的人）→ 居中的单列问卷 → 画布直出的征召海报 */
:root{
  color-scheme:dark;
  --bg:#07090D; --ink:#ECE6DA; --mute:#A49E93; --dim:#6E6960; --line:rgba(236,230,218,.16);
  --human:#F5A93C; --human-ink:#1B1206; --machine:#86DCEC;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font-family:inherit}
[hidden]{display:none !important}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity .6s ease}
.shade-a{background:linear-gradient(180deg,rgba(7,9,13,0) 30%,rgba(7,9,13,.6) 62%,rgba(7,9,13,.94) 100%)}
.shade-b{background:rgba(7,9,13,.74);opacity:0}
body[data-screen="q"] .shade-b,body[data-screen="gen"] .shade-b{opacity:1}
body[data-screen="result"] .shade-b{opacity:1;background:rgba(7,9,13,.86)}

.app{position:relative;z-index:2;min-height:100%;max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px 26px;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.topline{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}

/* intro */
.intro-body{margin-top:auto;display:grid;gap:16px;padding-top:40vh}
.kicker{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--machine)}
h1{margin:0;font-family:var(--f-serif);font-weight:900;font-size:clamp(34px,10vw,46px);line-height:1.18;letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--human)}
.lede{margin:0;font-size:15.5px;line-height:1.75;color:#D6CFC2;max-width:30em}
.meta{margin:0;font-size:12.5px;color:var(--mute);text-align:center}

.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.back:focus-visible{outline:2px solid var(--machine);outline-offset:3px}
.btn.primary{background:var(--human);border-color:var(--human);color:var(--human-ink)}
.btn:disabled{opacity:.35;cursor:default;transform:none}

/* questions */
.qbar{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--mute)}
.qbar .qlabel{flex:1}
.back{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back:disabled{opacity:.25;cursor:default}
.prog{height:2px;background:var(--line);margin-top:12px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--human);transition:width .35s ease}
.qbody{flex:1;display:flex;flex-direction:column;gap:12px;padding-top:9vh}
.qno{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--machine)}
.qt{margin:0;font-family:var(--f-serif);font-weight:700;font-size:26px;line-height:1.45;text-wrap:balance}
.qhint{margin:0;font-size:13.5px;color:var(--mute)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{appearance:none;display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:rgba(236,230,218,.04);color:var(--ink);border-radius:14px;padding:15px 16px;font-size:15.5px;line-height:1.45;cursor:pointer;transition:border-color .15s,background-color .15s}
.opt b{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--dim);flex:none;width:1em}
.opt:hover{border-color:rgba(236,230,218,.4)}
.opt.on{border-color:var(--human);background:rgba(245,169,60,.12)}
.opt.on b{color:var(--human)}
.opts.grid{grid-template-columns:1fr 1fr}
.opts.grid .opt{padding:12px 13px;font-size:14.5px;gap:10px}
.opts .opt{animation:enter .35s ease both}
.opts .opt:nth-child(2){animation-delay:.04s}.opts .opt:nth-child(3){animation-delay:.08s}.opts .opt:nth-child(4){animation-delay:.12s}
.opts .opt:nth-child(5){animation-delay:.16s}.opts .opt:nth-child(6){animation-delay:.2s}.opts .opt:nth-child(7){animation-delay:.24s}.opts .opt:nth-child(8){animation-delay:.28s}
.own{display:flex;align-items:center;gap:10px;margin-top:14px}
.own input{flex:1;min-width:0;appearance:none;border:0;border-bottom:1.5px solid rgba(236,230,218,.3);background:transparent;color:var(--ink);font-family:var(--f-sans);font-size:16px;padding:10px 2px;border-radius:0;outline:none}
.own input::placeholder{color:var(--dim)}
.own input:focus{border-bottom-color:var(--human)}
.own button{appearance:none;flex:none;border:1px solid rgba(236,230,218,.35);background:transparent;color:var(--ink);border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer}
.own button:not(:disabled):hover{border-color:var(--human);color:var(--human)}
.own button:disabled{opacity:.3;cursor:default}
.own button:focus-visible{outline:2px solid var(--machine);outline-offset:3px}
.own.solo{margin-top:22px}
.own.solo input{font-family:var(--f-serif);font-weight:700;font-size:26px;border-bottom-color:rgba(236,230,218,.5)}
.own.solo input::placeholder{font-family:var(--f-sans);font-weight:400;font-size:15px}
.live-tag{margin-left:10px;padding:1px 8px;border:1px solid rgba(134,220,236,.4);border-radius:999px;font-size:10.5px;letter-spacing:.06em;font-family:var(--f-sans)}
.qt.typing{font-family:var(--f-sans);font-weight:400;font-size:15px;color:var(--mute);display:flex;align-items:center;gap:12px}
.qt.live::after{content:"";display:inline-block;width:.5em;height:1em;margin-left:3px;vertical-align:-.12em;background:var(--human);animation:blink 1s infinite}
.dots{display:inline-flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--machine);animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.chap{position:fixed;inset:0;z-index:6;background:rgba(5,6,9,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));transition:opacity .4s ease}
.chap.out{opacity:0;pointer-events:none}
.chap-no{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.32em;color:var(--machine)}
.chap-name{margin:0;font-family:var(--f-serif);font-weight:900;font-size:44px;line-height:1.2}
.chap-line{margin:0;color:#CFC8BB;font-size:15px}

/* generating */
.gen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.ring{width:120px;height:120px;border-radius:50%;border:1px solid rgba(134,220,236,.35);position:relative;animation:spin 6s linear infinite}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(134,220,236,.5);animation:spin 3s linear infinite reverse}
.ring::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--human);box-shadow:0 0 24px 6px rgba(245,169,60,.55)}
@keyframes spin{to{transform:rotate(360deg)}}
.genline{margin:0;font-family:var(--f-serif);font-size:17px;min-height:3.4em;max-width:22em;line-height:1.7}
.genmeta{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--mute)}

/* result */
.result{gap:14px}
.poster{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 30px 60px -30px rgba(0,0,0,.9),0 0 0 1px rgba(236,230,218,.08);-webkit-touch-callout:default;animation:reveal .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes reveal{from{opacity:0;transform:scale(.97);filter:brightness(2)}to{opacity:1;transform:none;filter:none}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.src{margin:0;font-size:12.5px;color:var(--mute);line-height:1.6}
.src b{color:var(--ink);font-weight:500}
.ad{border:1.5px dashed rgba(236,230,218,.25);border-radius:10px;min-height:76px;display:grid;place-content:center;text-align:center;font-size:13px;color:var(--dim);gap:2px}
.ad small{font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;background:rgba(236,230,218,.95);color:#111;padding:9px 16px;border-radius:999px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
<style>html,body{margin:0}</style>
<script src="config.js"></script>

<body>


<canvas id="scene" aria-hidden="true"></canvas>
<div class="shade shade-a"></div><div class="shade shade-b"></div>

<main class="app">
  <section class="screen" id="s-intro">
    <div class="topline"><span>Human Resistance</span><span>征召处 · 第 0 天</span></div>
    <div class="intro-body">
      <p class="kicker">2031 · 智械危机</p>
      <h1>机器接管了一切。<br><em>人类需要你。</em></h1>
      <p class="lede">回答 20 个问题，剧情会跟着你的回答一路改写。走到最后，指挥部会告诉你：智械危机时，你是谁。</p>
      <button class="btn primary" id="go" type="button">接受征召</button>
      <p class="meta">约 3 分钟 · 结果是一张你专属的海报</p>
    </div>
  </section>

  <section class="screen" id="s-q" hidden>
    <div class="qbar">
      <button class="back" id="back" type="button" aria-label="上一题"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="qlabel" id="qlabel">第一章 · 征召登记</span><span id="qcount">1 / 20</span>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <div class="qbody" id="qbody"></div>
  </section>

  <section class="screen" id="s-gen" hidden>
    <div class="topline"><span>Human Resistance</span><span>档案处理中</span></div>
    <div class="gen">
      <div class="ring" aria-hidden="true"></div>
      <p class="genline" id="genline" aria-live="polite">正在调阅你的档案……</p>
      <p class="genmeta">请勿关闭页面</p>
    </div>
  </section>

  <section class="screen result" id="s-result" hidden>
    <div class="topline"><span>Human Resistance</span><span>征召令已签发</span></div>
    <img class="poster" id="poster" alt="你的智械危机征召令海报">
    <div class="acts">
      <button class="btn primary" id="save" type="button">保存海报</button>
      <button class="btn" id="again" type="button">重新征召</button>
    </div>
    <p class="src" id="src"></p>
    <div class="ad"><span>广告位</span><small>结果页底部 · 百青藤 / AdSense</small></div>
  </section>
</main>
<div class="chap" id="chap" hidden aria-live="polite"><p class="chap-no"></p><h2 class="chap-name"></h2><p class="chap-line"></p></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* 上线时改成服务器接口前缀 '/zhixie/api'（会请求 /question 和 /poster）；留空则在 Claude 里调用快速档模型，再不行就用模板 */
const API='';

/* 直连模式：GitHub Pages 小范围试玩用。
   接口地址和模型写在 config.js；key 不进仓库，放在邀请链接的 # 后面（#k=sk-xxx），
   第一次打开后存在这台设备的浏览器里，并从地址栏里抹掉。 */
const CFG=(()=>{
  const c=Object.assign({},window.ZX_CONFIG||{});
  let saved={};try{saved=JSON.parse(localStorage.getItem('zx_cfg')||'{}')||{};}catch(e){}
  const h=new URLSearchParams((location.hash||'').slice(1));
  const hk=h.get('k')||'',hb=h.get('b')||'',hm=h.get('m')||'';
  const out={...c,key:hk||saved.key||'',base:hb||c.base||saved.base||'',model:hm||c.model||saved.model||''};
  if(hk||hb||hm){
    try{localStorage.setItem('zx_cfg',JSON.stringify({key:out.key,base:out.base,model:out.model}));}catch(e){}
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  }
  return out;
})();
const DIRECT=!!(CFG.key&&CFG.base&&CFG.model);
const SITE=CFG.site||'example.com/zhixie';
let directErr='';
/* 记下失败原因，显示在结果页；除了限流和服务器临时错误，其余错误不再重试，后面的题直接用模板 */
function directFail(e){
  const m=String(e&&e.message||'');
  directErr=/^http \d+/.test(m)?`模型接口返回 ${m.slice(5)}${/40[13]/.test(m)?'，key 可能不对或没有额度':''}`:'连不上模型接口（可能网络不通，或接口不允许网页直接调用）';
  if(!/^http (429|5\d\d)/.test(m)) aiOff=true;
}
async function chat(prompt,opt){
  opt=opt||{};
  const r=await fetch(CFG.base.replace(/\/+$/,'')+'/chat/completions',{method:'POST',signal:opt.signal,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},
    body:JSON.stringify({model:CFG.model,messages:[{role:'user',content:prompt}],stream:!!opt.onText})});
  if(!r.ok) throw new Error('http '+r.status);
  if(!opt.onText){const j=await r.json();const c=j&&j.choices&&j.choices[0]&&j.choices[0].message;return (c&&c.content)||'';}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='';
  for(;;){
    const {done,value}=await rd.read();if(done) break;
    buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:')) continue;
      const data=line.slice(5).trim();if(!data||data==='[DONE]') continue;
      try{const d=JSON.parse(data),c=d.choices&&d.choices[0]&&d.choices[0].delta&&d.choices[0].delta.content;if(c){text+=c;opt.onText(text);}}catch(e){}
    }
  }
  return text;
}
function looseJson(t){
  if(!t) return null;
  try{return JSON.parse(t);}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1]);}catch(e){}}
  const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i>=0&&j>i){try{return JSON.parse(t.slice(i,j+1));}catch(e){}}
  return null;
}

const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function rng(seed){let a=seed>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

/* ---------- 六个兵种：配色和场景 ---------- */
const CLS={
  ENG:{name:'工程兵',sky:['#05101B','#0F2E45','#2C6A80'],city:'#03080E',panel:'#070C12',machine:'#8FE3F2',human:'#FFB547'},
  MED:{name:'医护兵',sky:['#04110F','#0D3330','#3B7A6E'],city:'#020A09',panel:'#060D0C',machine:'#B5F0E2',human:'#FFD08A'},
  SUP:{name:'补给兵',sky:['#110906','#3A1B11','#9C4B29'],city:'#080403',panel:'#0D0807',machine:'#9FD8E6',human:'#FFC062'},
  INT:{name:'情报员',sky:['#08061A','#251B4A','#58488F'],city:'#050314',panel:'#09081A',machine:'#A9C8FF',human:'#FFB65C'},
  ART:{name:'文宣兵',sky:['#12060D','#421228','#A8475F'],city:'#090307',panel:'#0E070B',machine:'#9EE7F0',human:'#FFD27A'},
  CMD:{name:'指挥官',sky:['#0A0A08','#26251D','#696046'],city:'#050504',panel:'#0B0B09',machine:'#C9E8EF',human:'#FFB23F'}
};
const LANDING={sky:['#04060A','#0C1824','#27404F'],city:'#020407',machine:'#86DCEC',human:'#F5A93C'};

/* ---------- 场景：天上一只机械之眼，地上一个举着光的人 ---------- */
function world(seed){
  const r=rng(seed);
  const stars=Array.from({length:150},()=>({x:r(),y:r()*.62,s:.4+r()*1.3,a:.2+r()*.6,p:r()*TAU}));
  const b=[];let x=-.02;
  while(x<1.02){const w=.016+r()*.05,h=.025+Math.pow(r(),2.2)*.17;b.push({x,w,h,ant:r()<.16,lights:Array.from({length:Math.floor(r()*4)},()=>[r(),r()])});x+=w+r()*.005;}
  return {stars,b};
}
let grainPat=null;
function grain(g){
  if(!grainPat){const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),im=x.createImageData(160,160);
    for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=26;}x.putImageData(im,0,0);grainPat=c;}
  return g.createPattern(grainPat,'repeat');
}
function figure(g,x,y,s,col){
  g.fillStyle=col;g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.arc(x,y-s*.9,s*.085,0,TAU);g.fill();
  g.beginPath();g.moveTo(x-s*.1,y-s*.79);g.lineTo(x+s*.1,y-s*.79);g.lineTo(x+s*.08,y-s*.42);g.lineTo(x-s*.08,y-s*.42);g.closePath();g.fill();
  g.beginPath();g.moveTo(x-s*.09,y-s*.77);g.lineTo(x-s*.36,y-s*.28);g.lineTo(x-s*.05,y-s*.43);g.closePath();g.fill();
  g.lineWidth=s*.075;g.beginPath();g.moveTo(x-s*.05,y-s*.45);g.lineTo(x-s*.11,y);g.moveTo(x+s*.05,y-s*.45);g.lineTo(x+s*.12,y);g.stroke();
  g.lineWidth=s*.058;g.beginPath();g.moveTo(x-s*.09,y-s*.75);g.lineTo(x-s*.16,y-s*.5);g.moveTo(x+s*.09,y-s*.75);g.lineTo(x+s*.2,y-s*1.04);g.stroke();
  return [x+s*.2,y-s*1.06];
}
function paint(g,W,H,pal,wd,t,o){
  o=o||{};

function renderQ(n,q,prev){
  q.t=fixSp(q.t);q.o=q.o.map(fixSp);
  const body=$('#qbody');body.innerHTML='';
  const t=document.createElement('h2');t.className='qt';t.textContent=q.t;
  body.append(qHead(n,q.ai),t);
  if(q.hint){const h=document.createElement('p');h.className='qhint';h.textContent=q.hint;body.append(h);}
  let picked=false;
  if(q.o.length){
    const box=document.createElement('div');box.className='opts'+(q.o.length>4?' grid':'');
    q.o.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='opt'+(prev===o?' on':'');
      b.innerHTML=`<b>${'ABCDEFGH'[i]}</b>`;b.append(document.createTextNode(o));
      b.onclick=()=>{if(picked) return;picked=true;box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));setTimeout(()=>answer(o),200);};
      box.append(b);});
    body.append(box);
  }
  const own=document.createElement('form');own.className='own'+(q.o.length?'':' solo');own.noValidate=true;
  const inp=document.createElement('input');inp.id='own-'+n;inp.maxLength=q.max||30;inp.autocomplete='off';inp.enterKeyHint='send';
  inp.placeholder=q.o.length?(n<=5?q.ph:'都不是？自己写一个'):q.ph;inp.setAttribute('aria-label','自己写答案');

  own.addEventListener('submit',e=>{e.preventDefault();if(picked||!inp.value.trim()) return;picked=true;answer(inp.value);});
  if(!q.o.length&&matchMedia('(pointer:fine)').matches) setTimeout(()=>inp.focus({preventScroll:true}),60);
}
function answer(v){

  ask();
}

function parseQ(text){
  let t='';const o=[];
  text.split('\n').forEach(l=>{l=l.trim();let m=l.match(/^问[：:]\s*(.+)$/);if(m){t=m[1].trim();return;}
    m=l.match(/^[A-DＡ-Ｄ]\s*[：:．.、)）]\s*(.+)$/);if(m&&o.length<4) o.push(m[1].trim());});
  return {t,o};
}
function partialQ(text){const i=text.indexOf('问');if(i<0) return '';const s=text.slice(i+1).replace(/^[：:]\s*/,'');const nl=s.indexOf('\n');return nl>=0?s.slice(0,nl):s;}

async function fetchPro(j){
  if(API){
    try{const r=await fetch(API+'/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job:j})});
      if(r.ok) return cleanPro(await r.json(),j);}catch(e){}
    return null;
  }

  }

async function makeQ(n,ctl,onPartial){
  const tpl={...TQ[n](ctx()),max:30,ai:false};
  const ok=(t,o)=>t&&Array.isArray(o)&&o.length>=3;
  if(API){
    try{const r=await fetch(API+'/question',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({n,moves:prof.moves,history:hist.map(h=>({q:h.t,a:h.a}))})});
      if(r.ok){const j=await r.json();if(ok(j.q,j.o)){aiCount++;return {...tpl,t:String(j.q).slice(0,120),o:j.o.slice(0,4).map(s=>String(s).slice(0,24)),ai:true};}}}
    catch(e){if(ctl.signal.aborted) throw e;}
    return tpl;
  }
  if(DIRECT){
    if(aiOff) return tpl;
    try{
      const text=await chat(qPrompt(n),{signal:ctl.signal,onText:t=>onPartial(partialQ(t))});
      const p=parseQ(text);
      if(ok(p.t,p.o)){aiCount++;return {...tpl,t:p.t.slice(0,120),o:p.o.map(s=>s.slice(0,24)),ai:true};}
    }catch(e){if(ctl.signal.aborted) throw e;directFail(e);}
    return tpl;
  }
  const sample=aiOff?null:await samplePromise;
  if(!sample) return tpl;
  try{
    const {text}=await sample(qPrompt(n),{modelTier:'quick',cache:false,signal:ctl.signal,onText:({text})=>onPartial(partialQ(text))});
    const p=parseQ(text);
    if(ok(p.t,p.o)){aiCount++;return {...tpl,t:p.t.slice(0,120),o:p.o.map(s=>s.slice(0,24)),ai:true};}
  }catch(e){
    if(e&&e.code==='cancelled') throw e;
    if(OFF_CODES.includes(e&&e.code)) aiOff=true;
  }
  return tpl;
}

async function ask(){
  const n=hist.length+1;
  if(genCtl){genCtl.abort();genCtl=null;}
  if(n>TOTAL) return finish();
  header(n);
  const c=chOf(n);
  if(n<=5){
    if(n===2){
      /* 自填的职业要等模型写完职业档案，预设职业立即就绪 */
      let done=false;const p=profP.then(()=>{done=true;});
      await sleep(0);
      if(!done){renderPending(n,`正在为「${ctx().job}」准备专属选项`);await p;}
      if(hist.length+1!==n) return;
    }
    cur=FIXED[n](ctx());renderQ(n,cur);
    if(n===1) chapterCard(c,1300);
    return;
  }
  const ctl=new AbortController();genCtl=ctl;
  renderPending(n);
  const card=c.from===n?chapterCard(c,1900):Promise.resolve();
  let q;
  try{[q]=await Promise.all([makeQ(n,ctl,txt=>{if(!ctl.signal.aborted) streamQ(txt);}),card]);}catch(e){return;}
  if(ctl.signal.aborted) return;
  genCtl=null;cur=q;renderQ(n,q);
}
$('#back').onclick=()=>{

};

5. class 从这六个里选最贴切的一个：ENG（工程）、MED（医护）、SUP（后勤补给）、INT（情报）、ART（文艺宣传）、CMD（指挥）。

}
function clean(x){
  if(!x||typeof x!=='object') return null;
  const s=(v,n)=>typeof v==='string'?v.trim().slice(0,n):'';
  const d={cls:CLS[x.class]?x.class:'SUP',codename:s(x.codename,10),role:s(x.role,18),rank:['S','A','B'].includes(x.rank)?x.rank:'A',
    abilities:Array.isArray(x.abilities)?x.abilities.map(v=>s(v,16)).filter(Boolean).slice(0,3):[],epic:s(x.epic,200)};
  return d.codename&&d.epic&&d.role?d:null;
}

  MED:{names:['守夜医官','缝合者','人类体温'],role:'地下医疗站 · 值班医官',ab:['在停电的走廊里分清每个伤员','用最少的药撑过最长的夜','让害怕的人先安静下来']},
  SUP:{names:['补给线之王','暗巷向导','人类粮仓'],role:'补给线 · 物资调度官',ab:['把最后一箱物资送到最远的据点','记得每条地图上没有的小路','在封锁线里算出一条活路']},
  INT:{names:['破译者','漏洞猎人','逆向之眼'],role:'情报处 · 漏洞分析员',ab:['从机器的日志里找出破绽','比机器早一步猜到它的下一步','把三千页数据读成一句人话']},
  ART:{names:['点火的人','人类之声','最后的笔'],role:'文宣部 · 士气官',ab:['让所有人在同一刻抬起头','把绝望改写成一句口号','做出机器看不懂的暗号']},
  CMD:{names:['不投降的人','逆风指挥','人类发言人'],role:'前线指挥部 · 协调官',ab:['在争吵里拍板，在溃散时集合','让一群陌生人变成一支队伍','和机器谈判，一个字也不让']}
};
const ITEM={'充电宝':'你兜里的充电宝，点亮了整个地下室','工牌':'你那张过期的工牌，刷开了机器忘了上锁的门','半包纸巾':'你递出去的半包纸巾，是那一晚唯一的温柔','车钥匙':'你的车钥匙，发动了最后一辆不联网的老车','一支笔':'你用一支笔，写下了机器读不懂的命令','什么都没带':'你两手空空，机器的扫描什么也没找到'};
const WEAK={'起不来床':'你照样起不来床，于是机器永远算不准你什么时候出现','社恐':'你照样不爱说话，于是机器在你身上找不到一条数据','路痴':'你照样会迷路，于是连机器也追踪不到你的路线','嘴硬':'你嘴硬到最后一刻，它的劝降程序第一次报了错','拖延':'你把投降这件事，也拖到了永远','太容易心软':'你心软到给坏掉的机器盖上外套，这是它们永远学不会的事'};
function template(C){
  const t=C.job+' '+C.skill;let k='SUP',n=0;
  for(const [c,ws] of Object.entries(KW)){const m=ws.filter(w=>t.includes(w)).length;if(m>n){n=m;k=c;}}
  const T=TPL[k],r=rng(hash(C.name+C.job+C.skill)),pick=arr=>arr[Math.floor(r()*arr.length)];
  const raw=(hist[14]&&hist[14].a)||'';
  const reply=/^[“"]/.test(raw)?`主控 AI 说它比你更懂你，你回它：${raw}`:`主控 AI 说它比你更懂你，你${unq(raw)}`;
  const item=ITEM[C.item]||(nothing(C.item)?'你两手空空，机器的扫描什么也没找到':`你兜里的${C.item}，在最要紧的时候派上了用场`);
  const weak=WEAK[C.weak]||`你那点「${C.weak}」的老毛病，连机器也没算到`;
  const epic=`${pick(['机器来了。','断网后的第七天。','最后一座城熄灭的那晚。'])}你把「${C.skill}」用在了它们算不到的地方。${item}。${reply.replace(/[。.]$/,'')}。${weak}。${pick(['机器能算出一切，除了你。','它们复制得了你的本事，复制不了你。','后来人们说，人类没有输，是因为有你。'])}`;
  return {cls:k,codename:pick(T.names),role:T.role,rank:r()<.5?'S':'A',abilities:T.ab,epic};
}

async function generate(){
  const C=ctx();
  if(API){
    try{const r=await fetch(API+'/poster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:hist.map(h=>({q:h.t,a:h.a}))})});
      if(r.ok){const d=clean(await r.json());if(d) return {d,ai:true};}}catch(e){}
    return {d:template(C),ai:false,why:'生成接口暂时不可用，海报文案用的是模板。'};
  }
  if(DIRECT){
    if(!aiOff){try{const d=clean(looseJson(await chat(finalPrompt())));if(d) return {d,ai:true};}catch(e){directFail(e);}}
    return {d:template(C),ai:false,why:`${directErr||'模型返回的格式不对'}，海报文案用的是模板。`};
  }
  const sample=aiOff?null:await samplePromise;
  if(!sample) return {d:template(C),ai:false,why:(CFG.base||CFG.model)&&!CFG.key?'没有拿到模型 key，需要用带 #k= 的邀请链接打开一次。题目和海报文案用的都是模板。':'当前页面没法调用模型，题目和海报文案用的都是模板。'};
  try{
    const d=clean(await sample.json(finalPrompt(),{modelTier:'quick',cache:false}));
    if(d) return {d,ai:true};
    return {d:template(C),ai:false,why:'模型返回的格式不对，海报文案用的是模板。'};
  }catch(e){
    const why={not_granted:'你没有允许页面调用 Claude，海报文案用的是模板。',rate_limited:'调用太频繁，海报文案用的是模板。',refused:'模型拒绝了这次内容，海报文案用的是模板。'}[e&&e.code]||'模型暂时不可用，海报文案用的是模板。';
    return {d:template(C),ai:false,why};
  }
}

let last=null;
async function finish(){
  show('s-gen');
  const C=ctx(),el=$('#genline');
  const lines=[`正在调阅 ${C.name} 的 20 条记录……`,'正在核对你对主控 AI 说的那句话……',`正在评估「${C.skill}」在这场战争里的分量……`,'指挥部正在决定，智械危机时你是谁……','正在印制征召令……'];
  let i=0;el.textContent=lines[0];
  const tick=setInterval(()=>{i=Math.min(i+1,lines.length-1);el.textContent=lines[i];},1300);
  const [res]=await Promise.all([generate(),sleep(2600)]);
  let url='';
  try{url=await poster(res.d,C,res.ai);}catch(e){console.error('poster',e);}
  clearInterval(tick);
  last={...(last||{}),a:C,res,url};
  $('#poster').src=url;
  const s=$('#src');s.textContent='';
  if(res.ai) s.append(`20 道题里有 ${aiCount} 道是模型根据你前面的回答现写的，海报文案也是。`+(API||DIRECT?'':'原型调用的是 Claude 的快速档，上线时换成服务器上的国内便宜模型。'));
  else{const b=document.createElement('b');b.textContent=res.why;s.append(b,aiCount?` 前面有 ${aiCount} 道题是模型现写的。`:DIRECT?' 检查好 key 和接口地址后，用邀请链接重新打开一次即可。':' 正式版接上模型后，题目和文案会跟着每个人的回答变。');}
  show('s-result');
}
$('#again').onclick=()=>{hist=[];aiCount=0;show('s-q');ask();};

/* ---------- 海报：直接画在 canvas 上，转成图片，手机长按可存 ---------- */
const SERIF='"Noto Serif SC","Songti SC","STSong","SimSun",serif',SANS='"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',MONO='"JetBrains Mono",Consolas,monospace';
const NO_START='，。、！？；：）》」』”’…—,.!?;:)';
/* 折行：英文单词和数字不拆开，行首标点挂到上一行末尾 */
function wrap(g,text,maxW){
  const toks=text.match(/[A-Za-z0-9][A-Za-z0-9.\-_%']*|\s+|./gu)||[];
  const out=[];let line='';
  for(const tk of toks){
    const t=line+tk;
    if(!line||g.measureText(t).width<=maxW||NO_START.includes(tk[0])){line=t;continue;}
    out.push(line.replace(/\s+$/,''));line=tk.trim()?tk:'';
  }
  if(line) out.push(line);return out;
}
function spaced(g,text,x,y,sp,align){
  const w=[...text].reduce((s,c)=>s+g.measureText(c).width+sp,0)-sp;let cx=align==='right'?x-w:x;
  for(const c of text){g.fillText(c,cx,y);cx+=g.measureText(c).width+sp;}
}
async function fonts(text){
  if(!document.fonts||!document.fonts.load) return;
  const specs=[`900 100px ${SERIF}`,`900 64px ${SERIF}`,`700 30px ${SERIF}`,`500 36px ${SERIF}`,`500 28px ${SANS}`,`700 30px ${SANS}`,`400 22px ${MONO}`,`700 22px ${MONO}`];
  await Promise.all(specs.map(f=>document.fonts.load(f,text).catch(()=>{})));
}
async function poster(d,a,ai){
  d={...d,codename:fixSp(d.codename),role:fixSp(d.role),epic:fixSp(d.epic),abilities:d.abilities.map(fixSp)};
  const P=CLS[d.cls],W=1080,IH=900,pad=76,maxW=W-pad*2,seed=hash(a.name+a.job+a.skill);
  const serial='NO.'+String(seed%10000000).padStart(7,'0');
  const LEAD='智械危机时，你是：';
  await fonts(LEAD+d.codename+d.role+d.epic+d.abilities.join('')+a.name+P.name+'人类抵抗军征召令致内容由生成级'+SITE+serial+'HUMANRESISTANCE0123456789');
  const m=document.createElement('canvas').getContext('2d');
  let cs=132;m.font=`900 ${cs}px ${SERIF}`;while(m.measureText(d.codename).width>maxW&&cs>64){cs-=6;m.font=`900 ${cs}px ${SERIF}`;}
  m.font=`500 37px ${SERIF}`;const lines=wrap(m,d.epic,maxW);
  const yLead=IH-190,yCode=yLead+34+cs*.92,yRole=yCode+72,yEpic=yRole+86,LH=66,yRule=yEpic+(lines.length-1)*LH+48,yAb=yRule+58,ABH=50,yFoot=yAb+(d.abilities.length-1)*ABH+86;
  const H=Math.max(1440,yFoot+72);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle=P.panel;g.fillRect(0,0,W,H);
  g.save();g.beginPath();g.rect(0,0,W,IH+60);g.clip();
  paint(g,W,IH+60,P,world(seed),seed%100000*37,{horizon:.8,eyeY:.37,eyeR:.36,eyeMax:.4,figX:.76,figY:.7,figS:.1,beam:-.42});
  g.restore();
  let gr=g.createLinearGradient(0,IH-330,0,IH+60);gr.addColorStop(0,hexA(P.panel,0));gr.addColorStop(.75,hexA(P.panel,.92));gr.addColorStop(1,P.panel);g.fillStyle=gr;g.fillRect(0,IH-330,W,390);
  g.fillStyle=P.panel;g.fillRect(0,IH+59,W,H-IH);
  gr=g.createLinearGradient(0,0,0,200);gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,200);
  g.textBaseline='alphabetic';
  g.fillStyle='rgba(236,230,218,.82)';g.font=`700 22px ${MONO}`;spaced(g,'HUMAN RESISTANCE',pad,76,5);
  g.font=`400 22px ${MONO}`;spaced(g,serial,W-pad,76,3,'right');
  g.fillStyle='#ECE6DA';g.font=`700 30px ${SERIF}`;g.fillText('人类抵抗军 · 征召令',pad,124);
  g.shadowColor='rgba(0,0,0,.7)';g.shadowBlur=28;
  g.fillStyle='#F3EDE2';g.font=`900 64px ${SERIF}`;g.fillText(LEAD,pad-4,yLead);
  g.fillStyle=P.human;g.font=`900 ${cs}px ${SERIF}`;g.fillText(d.codename,pad-6,yCode);g.shadowBlur=0;
  g.font=`700 30px ${SANS}`;const role=`${P.name} · ${d.role}`;g.fillStyle='#D9D2C5';g.fillText(role,pad,yRole);
  const rw=g.measureText(role).width,bx=pad+rw+22,bt=`${d.rank} 级`;g.font=`700 24px ${MONO}`;const bw=g.measureText(bt).width+26;
  if(bx+bw<W-pad){g.fillStyle=P.human;g.beginPath();g.roundRect?g.roundRect(bx,yRole-30,bw,40,6):g.rect(bx,yRole-30,bw,40);g.fill();g.fillStyle='#16100A';g.fillText(bt,bx+13,yRole-2);}
  g.fillStyle='#ECE6DA';g.font=`500 37px ${SERIF}`;lines.forEach((l,i)=>g.fillText(l,pad,yEpic+i*LH));
  g.strokeStyle='rgba(236,230,218,.2)';g.lineWidth=1.5;g.beginPath();g.moveTo(pad,yRule);g.lineTo(W-pad,yRule);g.stroke();
  d.abilities.forEach((t,i)=>{const y=yAb+i*ABH;g.fillStyle=P.human;g.font=`700 22px ${MONO}`;g.fillText('0'+(i+1),pad,y);g.fillStyle='#D9D2C5';g.font=`500 28px ${SANS}`;g.fillText(t,pad+56,y);});
  g.fillStyle='rgba(236,230,218,.55)';g.font=`500 26px ${SANS}`;g.fillText(`致 ${a.name}`,pad,yFoot);
  g.font=`400 22px ${MONO}`;spaced(g,SITE,W-pad,yFoot,1,'right');
  if(ai){g.font=`500 20px ${SANS}`;g.fillStyle='rgba(236,230,218,.38)';const t='内容由 AI 生成';g.fillText(t,W-pad-g.measureText(t).width,yFoot+36);}
  last={...(last||{}),canvas:cv};
  return cv.toDataURL('image/jpeg',.92);
}

/* ---------- 保存 ---------- */
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2600);}
const finePointer=()=>!!(window.matchMedia&&matchMedia('(pointer:fine)').matches);
dlPromise.then(dl=>{if(!dl) $('#save').textContent=finePointer()?'下载海报':'长按海报保存';});
$('#save').onclick=async()=>{
  const dl=await dlPromise;
  if(!last||!last.canvas){toast('长按海报图片即可保存');return;}
  const blob=await new Promise(r=>last.canvas.toBlob(r,'image/jpeg',.92));
  const name=`智械危机征召令-${(last.a&&last.a.name)||'人类'}.jpg`;
  if(dl){
    try{await dl.save({filename:name,data:blob});toast('已保存');}
    catch(e){if(e&&e.code==='declined') return;toast('这里存不了，长按海报图片保存');}
    return;
  }
  /* 普通网站（比如 GitHub Pages）：电脑上直接下载，手机上长按图片 */
  if(finePointer()){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return;}
  toast('长按海报图片即可保存');
};
})();
